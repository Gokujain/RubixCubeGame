<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="welcome-screen" class="screen active">
            <h1>Rubik's Cube Game</h1>
            <div class="size-selection">
                <label for="cube-size">Select Cube Size:</label>
                <select id="cube-size">
                    <option value="2">2x2x2</option>
                    <option value="3" selected>3x3x3</option>
                    <option value="4">4x4x4</option>
                    <option value="5">5x5x5</option>
                    <option value="6">6x6x6</option>
                </select>
            </div>
            <button id="start-game-btn" class="btn primary">Start Game</button>
            <button id="show-scoreboard-btn" class="btn secondary">View Scoreboard</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="timer-section">
                    <div id="timer">00:00</div>
                    <div class="timer-controls">
                        <button id="pause-btn" class="btn">Pause</button>
                        <button id="reset-btn" class="btn secondary">Reset</button>
                    </div>
                </div>
                <div class="cube-info">
                    <span id="cube-size-display">3x3x3</span>
                </div>
            </div>

            <div class="game-container">
                <div id="cube-container">
                    <canvas id="game-canvas"></canvas>
                </div>
                
                <div class="controls-panel">
                    <h3>Mouse Controls</h3>
                    <div class="mouse-instructions">
                        <p><strong>Click & Drag</strong> on cube faces to rotate them</p>
                        <p><strong>Drag</strong> empty space to rotate the entire cube</p>
                        <p><strong>Scroll</strong> to zoom in/out</p>
                    </div>
                    <button id="scramble-btn" class="btn secondary">Scramble Cube</button>
                </div>
            </div>
        </div>

        <div id="victory-screen" class="screen">
            <h2>Congratulations!</h2>
            <p>You solved the cube!</p>
            <div id="final-time"></div>
            <div class="name-input">
                <label for="player-name">Enter your name:</label>
                <input type="text" id="player-name" placeholder="Your name">
                <button id="save-score-btn" class="btn primary">Save Score</button>
            </div>
            <button id="play-again-btn" class="btn secondary">Play Again</button>
        </div>

        <div id="scoreboard-screen" class="screen">
            <h2>Scoreboard</h2>
            <div id="scoreboard-content">
                <div class="scoreboard-filters">
                    <label for="size-filter">Filter by size:</label>
                    <select id="size-filter">
                        <option value="all">All Sizes</option>
                        <option value="2">2x2x2</option>
                        <option value="3">3x3x3</option>
                        <option value="4">4x4x4</option>
                        <option value="5">5x5x5</option>
                        <option value="6">6x6x6</option>
                    </select>
                </div>
                <div id="scoreboard-list"></div>
            </div>
            <button id="back-to-menu-btn" class="btn secondary">Back to Menu</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
