<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="welcome-screen" class="screen active">
            <h1>Rubik's Cube Game</h1>
            <div class="size-selection">
                <label for="cube-size">Select Cube Size:</label>
                <select id="cube-size">
                    <option value="2">2x2x2</option>
                    <option value="3" selected>3x3x3</option>
                    <option value="4">4x4x4</option>
                    <option value="5">5x5x5</option>
                    <option value="6">6x6x6</option>
                </select>
            </div>
            <button id="start-game-btn" class="btn primary">Start Game</button>
            <button id="show-scoreboard-btn" class="btn secondary">View Scoreboard</button>
            <button id="show-task-tracker-btn" class="btn secondary">Task Tracker</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="timer-section">
                    <div id="timer">00:00</div>
                    <div class="timer-controls">
                        <button id="pause-btn" class="btn">Pause</button>
                        <button id="reset-btn" class="btn secondary">Reset</button>
                    </div>
                </div>
                <div class="cube-info">
                    <span id="cube-size-display">3x3x3</span>
                </div>
            </div>

            <div class="game-container">
                <div id="cube-container">
                    <canvas id="game-canvas"></canvas>
                </div>
                
                <div class="controls-panel">
                    <h3>Face Controls</h3>
                    <div class="face-controls">
                        <button class="face-btn" data-face="front">Front</button>
                        <button class="face-btn" data-face="back">Back</button>
                        <button class="face-btn" data-face="left">Left</button>
                        <button class="face-btn" data-face="right">Right</button>
                        <button class="face-btn" data-face="top">Top</button>
                        <button class="face-btn" data-face="bottom">Bottom</button>
                    </div>
                    <div class="rotation-controls">
                        <button id="clockwise-btn" class="btn">Clockwise</button>
                        <button id="counterclockwise-btn" class="btn">Counter-clockwise</button>
                    </div>
                    <button id="scramble-btn" class="btn secondary">Scramble Cube</button>
                </div>
            </div>
        </div>

        <div id="victory-screen" class="screen">
            <h2>Congratulations!</h2>
            <p>You solved the cube!</p>
            <div id="final-time"></div>
            <div class="name-input">
                <label for="player-name">Enter your name:</label>
                <input type="text" id="player-name" placeholder="Your name">
                <button id="save-score-btn" class="btn primary">Save Score</button>
            </div>
            <button id="play-again-btn" class="btn secondary">Play Again</button>
        </div>

        <div id="scoreboard-screen" class="screen">
            <h2>Scoreboard</h2>
            <div id="scoreboard-content">
                <div class="scoreboard-filters">
                    <label for="size-filter">Filter by size:</label>
                    <select id="size-filter">
                        <option value="all">All Sizes</option>
                        <option value="2">2x2x2</option>
                        <option value="3">3x3x3</option>
                        <option value="4">4x4x4</option>
                        <option value="5">5x5x5</option>
                        <option value="6">6x6x6</option>
                    </select>
                </div>
                <div id="scoreboard-list"></div>
            </div>
            <button id="back-to-menu-btn" class="btn secondary">Back to Menu</button>
        </div>

        <div id="task-tracker-screen" class="screen">
            <div class="task-header">
                <h2>Task Tracker</h2>
                <div class="gamification-stats">
                    <div class="stat-item">
                        <span class="stat-label">Points:</span>
                        <span id="total-points" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Daily Streak:</span>
                        <span id="daily-streak" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Tasks Today:</span>
                        <span id="tasks-today" class="stat-value">0</span>
                    </div>
                </div>
            </div>

            <div class="task-controls">
                <button id="add-task-btn" class="btn primary">Add New Task</button>
                <div class="task-filters">
                    <select id="status-filter">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                    <select id="priority-filter">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </div>
            </div>

            <div id="task-list" class="task-list"></div>

            <div class="achievements-section">
                <h3>Daily Achievements</h3>
                <div id="achievements-list" class="achievements-list"></div>
            </div>

            <button id="back-to-menu-from-tasks-btn" class="btn secondary">Back to Menu</button>
        </div>

        <div id="task-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">Add New Task</h3>
                    <button id="close-modal-btn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <div class="form-group">
                            <label for="task-title">Task Title:</label>
                            <input type="text" id="task-title" required>
                        </div>
                        <div class="form-group">
                            <label for="task-description">Description:</label>
                            <textarea id="task-description" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="task-priority">Priority:</label>
                            <select id="task-priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="estimated-time">Estimated Time (minutes):</label>
                            <input type="number" id="estimated-time" min="1" value="30">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn primary">Save Task</button>
                            <button type="button" id="cancel-task-btn" class="btn secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
